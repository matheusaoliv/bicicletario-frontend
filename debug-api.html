<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug API - Bicicletário</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>🔍 Debug API - Bicicletário</h1>
    
    <div>
        <button onclick="testAPI()">Testar API Base</button>
        <button onclick="testProprietarios()">Testar Proprietários</button>
        <button onclick="testBusca()">Testar Busca</button>
        <button onclick="testAuth()">Testar Auth</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'https://api-daja3h3cva-rj.a.run.app';
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            document.getElementById('results').appendChild(div);
        }
        
        async function testAPI() {
            try {
                log('🔌 Testando conectividade da API...', 'info');
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.text();
                log(`✅ API respondeu: ${response.status} - ${data}`, 'success');
            } catch (error) {
                log(`❌ Erro na API: ${error.message}`, 'error');
            }
        }
        
        async function testProprietarios() {
            try {
                log('👥 Testando endpoint de proprietários...', 'info');
                const response = await fetch(`${API_BASE}/proprietarios`);
                const data = await response.json();
                if (response.ok) {
                    log(`✅ Proprietários: ${Array.isArray(data) ? data.length : 'não é array'} registros`, 'success');
                    if (Array.isArray(data) && data.length > 0) {
                        log(`📋 Primeiro proprietário: ${JSON.stringify(data[0], null, 2)}`, 'info');
                    }
                } else {
                    log(`❌ Erro proprietários: ${response.status} - ${JSON.stringify(data)}`, 'error');
                }
            } catch (error) {
                log(`❌ Erro proprietários: ${error.message}`, 'error');
            }
        }
        
        async function testBusca() {
            try {
                log('🔍 Testando busca...', 'info');
                const response = await fetch(`${API_BASE}/controle-acesso/buscar?termo=a`);
                const data = await response.json();
                if (response.ok) {
                    log(`✅ Busca: ${Array.isArray(data) ? data.length : 'não é array'} resultados`, 'success');
                } else {
                    log(`❌ Erro busca: ${response.status} - ${JSON.stringify(data)}`, 'error');
                }
            } catch (error) {
                log(`❌ Erro busca: ${error.message}`, 'error');
            }
        }
        
        async function testAuth() {
            try {
                log('🔐 Testando autenticação...', 'info');
                const token = sessionStorage.getItem('token');
                if (token) {
                    log(`✅ Token encontrado: ${token.substring(0, 20)}...`, 'success');
                    
                    const response = await fetch(`${API_BASE}/funcionarios/ping`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({})
                    });
                    
                    if (response.ok) {
                        log(`✅ Token válido`, 'success');
                    } else {
                        log(`❌ Token inválido: ${response.status}`, 'error');
                    }
                } else {
                    log(`❌ Nenhum token encontrado. Faça login primeiro.`, 'error');
                }
            } catch (error) {
                log(`❌ Erro auth: ${error.message}`, 'error');
            }
        }
        
        // Teste automático ao carregar
        window.onload = () => {
            log('🚀 Iniciando diagnóstico automático...', 'info');
            testAPI();
        };
    </script>
</body>
</html>
