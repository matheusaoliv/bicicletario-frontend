<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug API - Bicicletário</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>🔍 Debug API - Bicicletário</h1>
    
    <div>
        <button onclick="testAPI()">Testar API Base</button>
        <button onclick="testProprietarios()">Testar Proprietários</button>
        <button onclick="testBusca()">Testar Busca</button>
        <button onclick="testBuscaCombinada()">Testar Busca Combinada</button>
        <button onclick="testAuth()">Testar Auth</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'https://api-daja3h3cva-rj.a.run.app';
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            document.getElementById('results').appendChild(div);
        }
        
        async function testAPI() {
            try {
                log('🔌 Testando conectividade da API...', 'info');
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.text();
                log(`✅ API respondeu: ${response.status} - ${data}`, 'success');
            } catch (error) {
                log(`❌ Erro na API: ${error.message}`, 'error');
            }
        }
        
        async function testProprietarios() {
            try {
                log('👥 Testando endpoint de proprietários...', 'info');
                const token = sessionStorage.getItem('token');
                
                // Teste sem token
                let response = await fetch(`${API_BASE}/proprietarios`);
                log(`🔓 Sem token: ${response.status}`, response.ok ? 'success' : 'error');
                
                // Teste com token
                if (token) {
                    response = await fetch(`${API_BASE}/proprietarios`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/json'
                        }
                    });
                    
                    log(`🔐 Com token: ${response.status}`, response.ok ? 'success' : 'error');
                    log(`📋 Headers enviados: Authorization: Bearer ${token.substring(0, 20)}...`, 'info');
                    
                    const responseText = await response.text();
                    log(`📄 Resposta raw: ${responseText}`, response.ok ? 'success' : 'error');
                    
                    if (response.ok) {
                        try {
                            const data = JSON.parse(responseText);
                            log(`✅ Proprietários: ${Array.isArray(data) ? data.length : 'não é array'} registros`, 'success');
                        } catch (e) {
                            log(`❌ Erro parsing JSON: ${e.message}`, 'error');
                        }
                    }
                }
            } catch (error) {
                log(`❌ Erro proprietários: ${error.message}`, 'error');
            }
        }
        
        async function testBusca() {
            try {
                log('🔍 Testando busca de proprietários...', 'info');
                const token = sessionStorage.getItem('token');
                
                if (token) {
                    const response = await fetch(`${API_BASE}/proprietarios?termo=a`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/json'
                        }
                    });
                    
                    log(`📋 Endpoint testado: /proprietarios?termo=a`, 'info');
                    
                    if (response.ok) {
                        const data = await response.json();
                        log(`✅ Busca: ${Array.isArray(data) ? data.length : 'não é array'} proprietários encontrados`, 'success');
                        if (Array.isArray(data) && data.length > 0) {
                            log(`📄 Primeiro resultado: ${data[0].nome_completo || 'Nome não encontrado'}`, 'info');
                            log(`🔍 Estrutura dos dados:`, 'info');
                            log(`   - CPF: ${data[0].cpf || 'não encontrado'}`, 'info');
                            log(`   - Contato: ${data[0].contato || 'não encontrado'}`, 'info');
                            log(`   - Bicicleta: ${data[0].bicicleta ? 'objeto encontrado' : 'não encontrado'}`, 'info');
                            if (data[0].bicicleta) {
                                log(`   - Bicicleta.marca: ${data[0].bicicleta.marca || 'não encontrado'}`, 'info');
                                log(`   - Bicicleta.numero_identificacao: ${data[0].bicicleta.numero_identificacao || 'não encontrado'}`, 'info');
                            }
                            log(`📋 Dados completos do primeiro item:`, 'info');
                            console.log('Primeiro item completo:', data[0]);
                        }
                    } else {
                        const responseText = await response.text();
                        log(`❌ Erro busca: ${response.status} - ${responseText}`, 'error');
                    }
                } else {
                    log(`❌ Token não encontrado. Faça login primeiro.`, 'error');
                }
            } catch (error) {
                log(`❌ Erro busca: ${error.message}`, 'error');
            }
        }
        
        async function testAuth() {
            try {
                log('🔐 Testando autenticação...', 'info');
                const token = sessionStorage.getItem('token');
                if (token) {
                    log(`✅ Token encontrado: ${token.substring(0, 20)}...`, 'success');
                    
                    const response = await fetch(`${API_BASE}/funcionarios/ping`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({})
                    });
                    
                    if (response.ok) {
                        log(`✅ Token válido`, 'success');
                    } else {
                        log(`❌ Token inválido: ${response.status}`, 'error');
                    }
                } else {
                    log(`❌ Nenhum token encontrado. Faça login primeiro.`, 'error');
                }
            } catch (error) {
                log(`❌ Erro auth: ${error.message}`, 'error');
            }
        }
        
        async function testBuscaCombinada() {
            const token = sessionStorage.getItem('token');
            if (!token) {
                log(`❌ Token não encontrado. Faça login primeiro.`, 'error');
                return;
            }
            
            const endpoints = [
                '/controle-acesso/buscar',
                '/proprietarios/buscar', 
                '/search/proprietarios',
                '/bicicletas/buscar',
                '/cadastros/buscar'
            ];
            
            log('🔍 Testando endpoints alternativos de busca...', 'info');
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(`${API_BASE}${endpoint}?termo=a`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        log(`✅ ${endpoint}: ${Array.isArray(data) ? data.length : 'não é array'} resultados`, 'success');
                        if (Array.isArray(data) && data.length > 0) {
                            const first = data[0];
                            if (first.proprietario && first.bicicleta) {
                                log(`   🎯 ENCONTRADO! Dados combinados: proprietário + bicicleta`, 'success');
                            } else if (first.nome_completo && first.bicicleta) {
                                log(`   🎯 ENCONTRADO! Proprietário direto + bicicleta`, 'success');
                            }
                        }
                    } else {
                        log(`❌ ${endpoint}: ${response.status} - ${response.statusText}`, 'error');
                    }
                } catch (error) {
                    log(`❌ ${endpoint}: ${error.message}`, 'error');
                }
            }
        }
        
        // Teste automático ao carregar
        window.onload = () => {
            log('🚀 Iniciando diagnóstico automático...', 'info');
            testAPI();
        };
    </script>
</body>
</html>
