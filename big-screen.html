<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bicicletário Japeri - Big Screen</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    :root{
      --bg: #0b1220; --fg: #e5e7eb; --muted: #93a4b8; --danger: #ef4444; --warn: #f59e0b; --ok: #22c55e; --card: #111827;
      --accent: #38bdf8;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .wrap { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
    header .title { font-weight: 700; font-size: 18px; letter-spacing: .3px; }
    header .right { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
    header .btn { background: transparent; color: var(--fg); border: 1px solid rgba(255,255,255,.18); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    header .btn:hover { background: rgba(255,255,255,.06); }

    .content { display: grid; grid-template-rows: auto 1fr; gap: 16px; padding: 16px 18px; }
    .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .kpi { background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 18px; display: grid; grid-template-columns: 1fr auto; align-items: center; }
    .kpi .label { font-size: 16px; color: var(--muted); }
    .kpi .value { font-size: 42px; font-weight: 800; }
    .kpi.criticos { box-shadow: inset 0 0 0 1px rgba(239,68,68,.25); }
    .kpi.atencao { box-shadow: inset 0 0 0 1px rgba(245,158,11,.25); }

    .list { background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01)); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .list .head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,.08); }
    .list .items { flex: 1; overflow: hidden; position: relative; }
    .items .scroll { position: absolute; inset: 0; overflow: hidden; }
    .item { display: grid; grid-template-columns: 1fr 1fr 1fr 120px; gap: 12px; padding: 14px 16px; border-bottom: 1px dashed rgba(255,255,255,.06); align-items: center; }
    .sev { font-weight: 700; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; font-size: 12px; text-align: center; }
    .sev.alta { color: #ffd3d3; background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.35); animation: pulse-red 2s ease-in-out infinite; }
    .sev.media { color: #fff0ce; background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.35); }
    @keyframes pulse-red { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.45); } 50% { box-shadow: 0 0 0 14px rgba(239,68,68,0); } }

    .muted { color: var(--muted); }
    .footer { color: var(--muted); font-size: 12px; padding-left: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">Big Screen — Alertas de Inatividade</div>
      <div class="right">
        <div id="lastUpdated">Atualizado: —</div>
        <button id="btnFullscreen" class="btn">Tela Cheia</button>
      </div>
    </header>
    <div class="content">
      <div class="kpis">
        <div class="kpi criticos">
          <div class="label">Críticos</div>
          <div id="kpiCriticos" class="value">0</div>
        </div>
        <div class="kpi atencao">
          <div class="label">Atenção</div>
          <div id="kpiAtencao" class="value">0</div>
        </div>
      </div>
      <div class="list">
        <div class="head">
          <div>Top 5 mais urgentes</div>
          <div class="muted footer">Fonte: /admin/alertas</div>
        </div>
        <div class="items">
          <div id="alertsScroll" class="scroll"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function(){
      const BASE_API = (window.API_BASE_URL && window.API_BASE_URL.trim() ? window.API_BASE_URL : 'https://southamerica-east1-bicicletario-japeri-v3.cloudfunctions.net/api').replace(/\/$/, '');
      function authHeaders(){ const t=sessionStorage.getItem('token'); const h={Accept:'application/json'}; if(t) h.Authorization='Bearer '+t; return h; }
      async function getJson(path, query){
        const url = new URL(BASE_API + (path.startsWith('/')?'': '/') + path);
        if(query && typeof query==='object') Object.entries(query).forEach(([k,v])=>{ if(v!==undefined && v!==null && v!=='') url.searchParams.set(k,v); });
        // compat=1 para /admin/*
        if(/\/admin\//.test(path) && !url.searchParams.has('compat')) url.searchParams.set('compat','1');
        const resp = await fetch(url.toString(), { headers: authHeaders(), cache: 'no-store' });
        if(resp.status===401){ alert('Sessão expirada. Faça login.'); location.href='admin-login.html'; return {}; }
        let data=null; try{ data=await resp.json(); }catch(e){}
        if(!resp.ok) throw new Error(data?.erro || data?.message || ('HTTP '+resp.status));
        return data;
      }
      function fmtDateTime(iso){ try{ return iso? new Date(iso).toLocaleString('pt-BR',{hour12:false}) : '-'; }catch(_){ return iso||'-'; } }
      function inactivityMinutes(a){ const d=Number.isFinite(a.dias_inatividade)?a.dias_inatividade:0; const h=Number.isFinite(a.horas_inatividade)?a.horas_inatividade:0; const m=Number.isFinite(a.minutos_inatividade)?a.minutos_inatividade:0; return Math.round(d*1440 + h*60 + m); }
      function sevFor(a){ const s=String(a.severidade||'').toLowerCase(); if(s==='alta'||s==='media'||s==='baixa') return s; // fallback por dias
        const d=Number.isFinite(a.dias_inatividade)?a.dias_inatividade: (Number.isFinite(a.horas_inatividade)?a.horas_inatividade/24 : (Number.isFinite(a.minutos_inatividade)?a.minutos_inatividade/1440 : 0));
        if(d>=7) return 'alta'; if(d>=3) return 'media'; return 'baixa'; }
      function sevWeight(s){ return s==='alta'?3 : s==='media'?2 : 1; }
      function renderAlerts(list){
        const cont = document.getElementById('alertsScroll');
        cont.innerHTML = '';
        const rows = list.slice(0,5).map(a=>{
          const nome = a.proprietario_nome || '-';
          const bike = [a.numero_identificacao, [a.marca, a.modelo].filter(Boolean).join(' ')].filter(Boolean).join(' • ');
          const local = a.local || '-';
          const entrada = a.data_hora_entrada ? fmtDateTime(a.data_hora_entrada) : '-';
          const sev = sevFor(a);
          return `<div class="item">
            <div><b>${nome}</b><div class="muted">${bike||'-'}</div></div>
            <div>${local}</div>
            <div>${entrada}</div>
            <div class="sev ${sev}">${sev.toUpperCase()}</div>
          </div>`;
        }).join('');
        cont.innerHTML = rows || '<div class="item"><div class="muted">Sem alertas</div></div>';
      }
      async function refresh(){
        try{
          const data = await getJson('/admin/alertas', { dias: '3', limit: '200' });
          const alertas = Array.isArray(data?.alertas)? data.alertas : [];
          let cAlta=0, cMedia=0; const scored = alertas.map(a=>{ const s=sevFor(a); if(s==='alta') cAlta++; else if(s==='media') cMedia++; const score=sevWeight(s)*1e9 + inactivityMinutes(a); return { a, score }; });
          scored.sort((x,y)=> y.score-x.score);
          document.getElementById('kpiCriticos').textContent = String(cAlta);
          document.getElementById('kpiAtencao').textContent = String(cMedia);
          renderAlerts(scored.map(x=>x.a));
          document.getElementById('lastUpdated').textContent = 'Atualizado: ' + new Date().toLocaleTimeString('pt-BR', { hour12:false });
        } catch(e){ console.error(e); }
      }
      function bindFS(){
        const btn = document.getElementById('btnFullscreen');
        btn.addEventListener('click', ()=>{
          const elem = document.documentElement; const d = document; const rq = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.mozRequestFullScreen || elem.msRequestFullscreen; const ex = d.exitFullscreen || d.webkitExitFullscreen || d.mozCancelFullScreen || d.msExitFullscreen;
          if(!d.fullscreenElement && !d.webkitFullscreenElement && !d.mozFullScreenElement && !d.msFullscreenElement){ rq && rq.call(elem); } else { ex && ex.call(d); }
        });
      }
      document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refresh(); });
      bindFS(); refresh(); setInterval(refresh, 30000);
    })();
  </script>
</body>
</html>
