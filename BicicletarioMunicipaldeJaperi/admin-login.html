<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Administrador - Login</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/admin-login.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1>Painel do Administrador</h1>
      <nav>
        <a href="area-funcionario.html">Painel de Controle</a>
        <!-- Botão Sair removido na tela de login -->
      </nav>
    </div>
  </header>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <i class="bx bxs-lock-alt login-icon"></i>
        <h1>Painel Administrativo</h1>
        <p>Bicicletário Municipal de Japeri</p>
      </div>
      
      <div class="login-content">
        <p class="login-subtitle">Faça login com sua conta Google</p>
        
        <button type="button" id="btnGoogleLogin" class="google-btn">
          <i class="bx bxl-google"></i>
          <span>Entrar com Google</span>
        </button>
        
        <div class="login-info">
          <i class="bx bx-info-circle"></i>
          <p>Apenas funcionários da secretaria podem acessar este painel</p>
        </div>
      </div>
      
      <div class="login-footer">
        <a href="area-funcionario.html" class="back-link">
          <i class="bx bx-arrow-back"></i>
          Voltar para Painel de Controle
        </a>
      </div>
    </div>
  </div>
  
  <!-- Firebase SDK - DEVE carregar ANTES do admin-login.js -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  
  <!-- Config local removido para produção -->
  <script src="js/admin-login.js"></script>
</body>
</html>
