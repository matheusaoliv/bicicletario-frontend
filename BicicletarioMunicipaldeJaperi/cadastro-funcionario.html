    <style>

        font-family: 'Roboto', sans-serif;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(120deg, #e0f7fa 0%, #b2dfdb 100%), url('imagens/estacaojaperi.jpg') center center / cover no-repeat;
        opacity: 0.23;
        pointer-events: none;
      }
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100vw;
        position: relative;
        overflow: hidden;
      }
      .login-container::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        background: url('imagens/estacaojaperi.jpg') center center / cover no-repeat;
        opacity: 0.23;
        pointer-events: none;
      }
      .login-container > * {
        position: relative;
        z-index: 1;
      }
      .login-box {
        background: rgba(255,255,255,0.91);

        width: 100%;

      h2 {

      }
      .input-group {
        width: 100%;
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      label {
        font-weight: bold;
        margin-bottom: 4px;
        color: #333;
      }
      input[type="text"],
      input[type="password"] {
        width: 95%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ade8f4;
        background-color: #f8f9fa;
        font-size: 1em;

      }
      input:focus {
        border-color: #007bff;
        outline: none;
        box-shadow: 0 0 0 0.2rem rgba(0,123,255,.13);
      }
      button[type="submit"], button[type="button"] {
        background: #2a9d8f;
        color: white;
        border: none;
        border-radius: 7px;
        padding: 10px 16px;
        font-size: 1em;
        cursor: pointer;
        width: 100%;
        margin-bottom: 8px;
        font-weight: bold;
        transition: background 0.2s, transform 0.15s;
      }
      button[type="button"] {
        background: #bbb;
        color: #333;
        margin-bottom: 0;
      }
      button[type="submit"]:hover {
        background: #21867a;
        transform: translateY(-2px);
        box-shadow: 0 3px 8px rgba(0,0,0,0.09);
      }
      button[type="button"]:hover {
        background: #999;
      }
      #cadastroMensagem {
        margin-top: 15px;
        font-size: 0.95em;
        text-align: center;
      }
      .form-funcionario {
        width: 100%;
        max-width: 380px;
      }
      .titulo-cadastro-funcionario {
        font-size: 1.3em;
        color: #005f73;
        margin-bottom: 15px;
        text-align: center;
      }
      .btn-cadastrar-funcionario {
        width: 100%;
        padding: 10px 0;
        background: #2a9d8f;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        margin-top: 18px;
      }
      .btn-cadastrar-funcionario:hover {
        background: #21867a;
      }
      @media (max-width: 600px) {
        .login-box {
          padding: 18px 7px 14px 7px;
        }
      }
    .input-group-mb18 {
  margin-bottom: 18px;
}
    .radio-group {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      cursor: pointer;
    }
    .radio-group input[type="radio"] {
      cursor: pointer;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 15px 0;
      color: #666;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #ddd;
    }
    .divider span {
      padding: 0 10px;
      font-size: 0.9em;
    }
    .google-btn {
      width: 100%;
      padding: 12px 0;
      background: white;
      color: #444;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 1em;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .google-btn:hover {
      background: #f8f9fa;
      border-color: #4285f4;
      box-shadow: 0 2px 8px rgba(66, 133, 244, 0.2);
    }
    .google-btn img {
      width: 20px;
      height: 20px;
    }
    #googleDataInfo {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 4px;
      display: none;
    }
    #googleDataInfo p {
      margin: 4px 0;
      font-size: 0.9em;
      color: #1565c0;
    }
</style>
</head>
<body>
    <main class="login-container">
  <div class="login-box">
    <div style="display: flex; justify-content: center; margin-bottom: 18px;">
      <button id="abaCadastro" type="button" class="btn-aba ativo">Cadastro</button>
      <button id="abaLogin" type="button" class="btn-aba">Login</button>
    </div>
    <form id="cadastroFuncionarioForm" class="form-funcionario">
      <h2 class="titulo-cadastro-funcionario">Cadastro de Novo Funcionário</h2>
      <div class="input-group">
        <label for="nomeFuncionario">Nome Completo:</label>
        <input type="text" id="nomeFuncionario" name="nomeFuncionario" required>
      </div>
      <div class="input-group">
        <label for="usuarioFuncionario">Nome de Usuário:</label>
        <input type="text" id="usuarioFuncionario" name="usuarioFuncionario" required>
      </div>
      <div class="input-group">
        <label for="emailFuncionario">E-mail (opcional):</label>
        <input type="text" id="emailFuncionario" name="emailFuncionario">
      </div>
      <div class="input-group input-group-mb18">
        <label for="senhaFuncionario">Senha:</label>
        <input type="password" id="senhaFuncionario" name="senhaFuncionario" required>
      </div>
      
      <div id="googleDataInfo"></div>
      
      <div class="input-group">
        <label style="font-weight: bold; margin-bottom: 8px;">Tipo de Funcionário:</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="tipoFuncionario" value="secretaria" required>
            <span>Secretaria</span>
          </label>
          <label>
            <input type="radio" name="tipoFuncionario" value="bicicletario" required>
            <span>Bicicletário</span>
          </label>
        </div>
      </div>
      
      <button type="submit">Cadastrar</button>
      
      <div class="divider">
        <span>ou</span>
      </div>
      
      <button type="button" id="btnGoogleCadastro" class="google-btn">
        <img src="imagens/google-light.png" alt="Google">
        <span>Cadastrar com Google</span>
      </button>
      <div id="cadastroMensagem"></div>
    </form>
    <form id="loginFuncionarioForm" class="form-funcionario" style="display:none;">
      <h2 class="titulo-cadastro-funcionario">Login de Funcionário</h2>
      <div class="input-group">
        <label for="usuarioLogin">Nome de Usuário:</label>
        <input type="text" id="usuarioLogin" name="usuarioLogin" required>
      </div>
      <div class="input-group input-group-mb18">
        <label for="senhaLogin">Senha:</label>
        <input type="password" id="senhaLogin" name="senhaLogin" required>
      </div>
      <button type="submit">Entrar</button>
      <div id="loginMensagem"></div>
    </form>
  </div>
</main>
<script>
// Base unificada da API: aceita window.API_BASE_URL com ou sem /api
const BASE_API = (
  (window.API_BASE_URL && window.API_BASE_URL.trim())
    ? window.API_BASE_URL
    : 'https://api-daja3h3cva-rj.a.run.app'
).replace(/\/$/, '');

// Troca de abas
const abaCadastro = document.getElementById('abaCadastro');
const abaLogin = document.getElementById('abaLogin');
const cadastroForm = document.getElementById('cadastroFuncionarioForm');
const loginForm = document.getElementById('loginFuncionarioForm');
abaCadastro.onclick = () => {
  abaCadastro.classList.add('ativo'); abaLogin.classList.remove('ativo');
  cadastroForm.style.display = 'block'; loginForm.style.display = 'none';
};
abaLogin.onclick = () => {
  abaLogin.classList.add('ativo'); abaCadastro.classList.remove('ativo');
  cadastroForm.style.display = 'none'; loginForm.style.display = 'block';
};

// Cadastro de Funcionário (API)
cadastroForm.onsubmit = async function(event) {
  event.preventDefault();
  const nome_completo = document.getElementById('nomeFuncionario').value.trim();
  const nome_usuario = document.getElementById('usuarioFuncionario').value.trim();
  const senha = document.getElementById('senhaFuncionario').value;
  const email = document.getElementById('emailFuncionario').value.trim();
  const cadastroMensagem = document.getElementById('cadastroMensagem');
  cadastroMensagem.textContent = '';

  if (!nome_completo || !nome_usuario || !senha) {
    cadastroMensagem.textContent = 'Por favor, preencha todos os campos obrigatórios.';
    cadastroMensagem.style.color = '#b22222';
    return;
  }

  // Validar comprimento mínimo da senha
  if (senha.length < 6) {
    cadastroMensagem.textContent = 'A senha deve ter pelo menos 6 caracteres.';
    cadastroMensagem.style.color = '#b22222';
    return;
  }
  try {
    const resp = await fetch(`${BASE_API}/funcionarios/cadastro`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome_completo, nome_usuario, senha, email })
    });
    const data = await resp.json();
    if (resp.ok) {
      cadastroMensagem.textContent = data.mensagem;
      cadastroMensagem.style.color = '#21867a';
      cadastroForm.reset();
    } else {
      cadastroMensagem.textContent = data.erro || 'Erro ao cadastrar.';
      cadastroMensagem.style.color = '#b22222';
    }
  } catch (e) {
    cadastroMensagem.textContent = 'Erro de conexão com o servidor.';
    cadastroMensagem.style.color = '#b22222';
  }
};

// Login de Funcionário (API)
loginForm.onsubmit = async function(event) {
  event.preventDefault();
  const nome_usuario = document.getElementById('usuarioLogin').value.trim();
  const senha = document.getElementById('senhaLogin').value;
  const loginMensagem = document.getElementById('loginMensagem');
  loginMensagem.textContent = '';
  if (!nome_usuario || !senha) {
    loginMensagem.textContent = 'Preencha usuário e senha.';
    loginMensagem.style.color = '#b22222';
    return;
  }
  try {
    const resp = await fetch(`${BASE_API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome_usuario, senha })
    });
    const data = await resp.json();
    if (resp.ok) {
      loginMensagem.textContent = data.mensagem;
      loginMensagem.style.color = '#21867a';
      sessionStorage.setItem('funcionarioLogado', JSON.stringify(data.funcionario));
      if (data.token) {
        sessionStorage.setItem('token', data.token);
      }
      setTimeout(() => {
        window.location.href = 'cadastrobicicletario.html';
      }, 700);
    } else {
      loginMensagem.textContent = data.erro || 'Erro ao fazer login.';
      loginMensagem.style.color = '#b22222';
    }
  } catch (e) {
    loginMensagem.textContent = 'Erro de conexão com o servidor.';
    loginMensagem.style.color = '#b22222';
  }
};

// ===== FIREBASE AUTHENTICATION =====
// Dados do Google (temporários)
let googleUserData = null;

// Inicializar Firebase IMEDIATAMENTE
(function() {
  const firebaseConfig = {
    apiKey: "AIzaSyCNSGHAWr4ZuTuEl3xmMqGe0mfhSH4dheo",
    authDomain: "bicicletario-japeri-v3.firebaseapp.com",
    projectId: "bicicletario-japeri-v3",
    storageBucket: "bicicletario-japeri-v3.firebasestorage.app",
    messagingSenderId: "366886346323",
    appId: "1:366886346323:web:2a4a16e8a4d5faac8470a6",
    measurementId: "G-Q3L2V32QK1"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
})();

// Função para obter auth
function getAuth() {
  return firebase.auth();
}

// Função de cadastro com Google
async function cadastrarComGoogle() {
  try {
    console.log('🔐 Iniciando cadastro com Google...');
    
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({
      prompt: 'select_account'
    });
    
    console.log('🚀 Abrindo popup do Google...');
    // Usar POPUP em vez de redirect
    const result = await getAuth().signInWithPopup(provider);
    
    if (!result || !result.user) {
      throw new Error('Nenhum usuário retornado do Google');
    }
    
    const user = result.user;
    console.log('✅ Autenticado com Google para cadastro:', user.email);
    
    // Preencher formulário automaticamente
    googleUserData = {
      nome: user.displayName,
      email: user.email,
      foto: user.photoURL,
      firebaseUid: user.uid
    };
    
    document.getElementById('nomeFuncionario').value = user.displayName || '';
    document.getElementById('emailFuncionario').value = user.email || '';
    document.getElementById('usuarioFuncionario').value = (user.email || '').split('@')[0];
    
    // Tornar senha opcional para cadastro com Google
    const senhaInput = document.getElementById('senhaFuncionario');
    senhaInput.required = false;
    senhaInput.placeholder = 'Senha (opcional para cadastro com Google)';
    
    // Mostrar informação
    const googleDataInfo = document.getElementById('googleDataInfo');
    googleDataInfo.innerHTML = `
      <p><strong>✅ Dados do Google carregados:</strong></p>
      <p>📧 Email: ${user.email}</p>
      <p>👤 Nome: ${user.displayName}</p>
      <p><strong>Escolha o tipo de funcionário e clique em Cadastrar</strong></p>
    `;
    googleDataInfo.style.display = 'block';
    
    // Focar no tipo de funcionário
    const radioSecretaria = document.querySelector('input[name="tipoFuncionario"][value="secretaria"]');
    if (radioSecretaria) {
      radioSecretaria.focus();
    }
    
  } catch (error) {
    console.error('❌ Erro no cadastro Google:', error);
    const cadastroMensagem = document.getElementById('cadastroMensagem');
    if (error.code === 'auth/popup-blocked') {
      cadastroMensagem.textContent = 'Popup bloqueado! Permita popups para este site.';
    } else if (error.code === 'auth/popup-closed-by-user') {
      cadastroMensagem.textContent = 'Cadastro cancelado.';
    } else {
      cadastroMensagem.textContent = 'Erro no cadastro com Google: ' + (error.message || 'Erro desconhecido');
    }
    cadastroMensagem.style.color = '#b22222';
  }
}

// Modificar o submit do cadastro para incluir dados do Google
const cadastroFormOriginal = cadastroForm.onsubmit;
cadastroForm.onsubmit = async function(event) {
  event.preventDefault();
  
  const nome_completo = document.getElementById('nomeFuncionario').value.trim();
  const nome_usuario = document.getElementById('usuarioFuncionario').value.trim();
  let senha = document.getElementById('senhaFuncionario').value;
  const email = document.getElementById('emailFuncionario').value.trim();
  const tipoFuncionario = document.querySelector('input[name="tipoFuncionario"]:checked');
  const cadastroMensagem = document.getElementById('cadastroMensagem');
  cadastroMensagem.textContent = '';

  if (!nome_completo || !nome_usuario) {
    cadastroMensagem.textContent = 'Por favor, preencha todos os campos obrigatórios.';
    cadastroMensagem.style.color = '#b22222';
    return;
  }
  
  if (!tipoFuncionario) {
    cadastroMensagem.textContent = 'Por favor, selecione o tipo de funcionário.';
    cadastroMensagem.style.color = '#b22222';
    return;
  }

  // Se não tem dados do Google, senha é obrigatória
  if (!googleUserData && (!senha || senha.length < 6)) {
    cadastroMensagem.textContent = 'A senha deve ter pelo menos 6 caracteres.';
    cadastroMensagem.style.color = '#b22222';
    return;
  }
  
  // Se tem dados do Google mas não tem senha, gerar uma aleatória
  if (googleUserData && !senha) {
    senha = Math.random().toString(36).slice(-12) + Math.random().toString(36).slice(-12);
  }

  try {
    const dadosCadastro = {
      nome_completo,
      nome_usuario,
      senha,
      email,
      local: tipoFuncionario.value === 'secretaria' ? 'Secretaria' : 'Bicicletário',
      cargo: tipoFuncionario.value === 'secretaria' ? 'Funcionário da Secretaria' : 'Funcionário do Bicicletário'
    };
    
    // Se tem dados do Google, adicionar
    if (googleUserData) {
      dadosCadastro.fotoUrl = googleUserData.foto;
      dadosCadastro.firebaseUid = googleUserData.firebaseUid;
      dadosCadastro.cadastroGoogle = true;
    }
    
    const resp = await fetch(`${BASE_API}/funcionarios/cadastro`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dadosCadastro)
    });
    
    const data = await resp.json();
    
    if (resp.ok) {
      cadastroMensagem.textContent = data.mensagem + ' Redirecionando para login...';
      cadastroMensagem.style.color = '#21867a';
      cadastroForm.reset();
      googleUserData = null;
      document.getElementById('googleDataInfo').style.display = 'none';
      
      // Fazer logout do Firebase
      if (getAuth().currentUser) {
        await getAuth().signOut();
      }
      
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    } else {
      cadastroMensagem.textContent = data.erro || 'Erro ao cadastrar.';
      cadastroMensagem.style.color = '#b22222';
    }
  } catch (e) {
    console.error('Erro:', e);
    cadastroMensagem.textContent = 'Erro de conexão com o servidor.';
    cadastroMensagem.style.color = '#b22222';
  }
};

// Adicionar evento ao botão Google ao carregar DOM
document.addEventListener('DOMContentLoaded', () => {
  const btnGoogleCadastro = document.getElementById('btnGoogleCadastro');
  if (btnGoogleCadastro) {
    btnGoogleCadastro.addEventListener('click', cadastrarComGoogle);
  }
});
</script>

.btn-aba.ativo {
  background: #2a9d8f;

</body>
