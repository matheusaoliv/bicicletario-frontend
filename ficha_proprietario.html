  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // Util: ler parâmetros da URL
    function getParam(name){
      const u = new URL(window.location.href);
      return u.searchParams.get(name);
    }

    // Verifica se há registros de acesso vinculados à bicicleta
    async function contarRegistrosBike(b){
      const id = b?.id;
      if(!id) return 0;
      // Novo endpoint dedicado
      try {
        const dep = await api.get(`/bicicletas/${encodeURIComponent(id)}/dependencias`);
        const total = (dep && (dep.total ?? dep.count ?? 0)) || 0;
        return total;
      } catch(err){
        console.warn('[ficha] dependencias endpoint indisponível, usando fallback de busca', err?.message||err);
        // Fallback: busca agregada (menos precisa)
        try {
          const termo = String(b?.numero_identificacao || b?.id || '').trim();
          if(!termo) return 0;
          const data = await api.get(`/controle-acesso/buscar?termo=${encodeURIComponent(termo)}`);
          const lista = Array.isArray(data) ? data : [];
          const match = lista.filter(it => String(it.bicicleta?.id) === String(b?.id));
          return match.length;
        } catch(err2){ console.warn('[ficha] Falha no fallback de busca', err2); return 0; }
      }
    }

    // =====================
    // Selects dependentes (Tipo→Marca→Modelo) com busca e 'Outro'
    // =====================
    let catalogoBikes = null;
    let fichaCurrentMarcas = [], fichaCurrentModelos = [];
    function fichaEls(){
      return {
        tipoSel: $('fichaBikeTipo'),
        marcaSel: $('fichaBikeMarca'),
        modeloSel: $('fichaBikeModelo'),
        marcaSearch: $('fichaMarcaSearch'),
        modeloSearch: $('fichaModeloSearch'),
        marcaSug: $('fichaMarcaSuggestions'),
        modeloSug: $('fichaModeloSuggestions'),
        marcaClear: $('fichaMarcaClear'),
        modeloClear: $('fichaModeloClear'),
        marcaOutroWrap: $('fichaMarcaOutroWrap'),
        modeloOutroWrap: $('fichaModeloOutroWrap'),
        marcaOutroInp: $('fichaMarcaOutro'),
        modeloOutroInp: $('fichaModeloOutro'),
      };
    }
    function resetSelect(el, placeholder, disabled=true){ if(!el) return; el.innerHTML=''; el.appendChild(new Option(placeholder, '')); if(disabled) el.setAttribute('disabled',''); else el.removeAttribute('disabled'); }
    function habilitarBusca(el, enabled){ if(!el) return; if(enabled){ el.removeAttribute('disabled'); } else { el.setAttribute('disabled',''); el.value=''; } }
    function habilitarClear(btn, enabled){ if(!btn) return; if(enabled){ btn.removeAttribute('disabled'); } else { btn.setAttribute('disabled',''); } }
    function norm(s){ return (s||'').toLowerCase(); }
    async function initBikeCatalog(){
      if(catalogoBikes) return;
      try {
        const resp = await fetch('data/catalogo-bikes.json', { cache: 'no-store' });
        if(resp.ok){ const data = await resp.json(); if(data && typeof data==='object'){ catalogoBikes = data; return; } }
      } catch(_) {}
      catalogoBikes = {}; // fallback vazio; usuário pode usar 'Outro'
    }
    function aplicarFiltroSelect(selectEl, base, query, placeholder, incluirOutro){
      resetSelect(selectEl, placeholder, false);
      const q = norm(query);
      const lista = q ? base.filter(v => norm(v).includes(q)) : base;
      lista.forEach(v => selectEl.appendChild(new Option(v, v)));
      if(incluirOutro) selectEl.appendChild(new Option('Outro', 'Outro'));
    }
    function popularMarcasPorTipoFicha(tipo){
      const { marcaSel, modeloSel, marcaSearch, marcaClear, modeloSearch, modeloClear, marcaSug, modeloSug, marcaOutroWrap, modeloOutroWrap, marcaOutroInp, modeloOutroInp } = fichaEls();
      resetSelect(marcaSel, 'Selecione a Marca', true);
      resetSelect(modeloSel, 'Selecione o Modelo', true);
      if(!catalogoBikes || !catalogoBikes[tipo]){ habilitarBusca(marcaSearch, false); habilitarClear(marcaClear, false); habilitarBusca(modeloSearch, false); habilitarClear(modeloClear, false); return; }
      fichaCurrentMarcas = Object.keys(catalogoBikes[tipo] || {}).sort();
      fichaCurrentMarcas.forEach(m => marcaSel.appendChild(new Option(m, m)));
      marcaSel.appendChild(new Option('Outro','Outro'));
      marcaSel.removeAttribute('disabled');
      habilitarBusca(marcaSearch, true); habilitarClear(marcaClear, true);
      habilitarBusca(modeloSearch, false); habilitarClear(modeloClear, false);
      if(marcaSug) marcaSug.classList.remove('show'); if(modeloSug) modeloSug.classList.remove('show');
      marcaOutroWrap.classList.add('hidden'); marcaOutroInp.removeAttribute('required');
      modeloOutroWrap.classList.add('hidden'); modeloOutroInp.removeAttribute('required');
    }
    function popularModelosPorMarcaFicha(tipo, marca){

    // Helpers de UI

    function preencherProprietario(p={}){
      if(p.id) $('proprietarioId').value = p.id;
      $('fichaNome').value = p.nome_completo || '';
      $('fichaEmail').value = p.email || '';
      $('fichaCpf').value = p.cpf || '';
      $('fichaContato').value = p.contato || '';

    }
    function preencherBike(b={}){
      $('bicicletaId').value = b.id || '';
      $('fichaBikeNumeroID').value = (b.numero_identificacao || '').toUpperCase();
      const tipoSel = document.getElementById('fichaBikeTipo');
      const marcaSel = document.getElementById('fichaBikeMarca');
      const modeloSel = document.getElementById('fichaBikeModelo');
      const marcaOutroWrap = document.getElementById('fichaMarcaOutroWrap');
      const modeloOutroWrap = document.getElementById('fichaModeloOutroWrap');
      const marcaOutroInp = document.getElementById('fichaMarcaOutro');
      const modeloOutroInp = document.getElementById('fichaModeloOutro');
      const tiposValidos = ['Mountain Bike','Speed','Urbana','Elétrica','Dobrável','Infantil'];
      const tipoRaw = b.tipo_bike || '';
      const tipoVal = tiposValidos.includes(tipoRaw) ? tipoRaw : (tipoRaw ? 'Outro' : '');
      if(tipoSel){ tipoSel.value = tipoVal || ''; tipoSel.dispatchEvent(new Event('change')); }
      if(tipoVal === 'Outro'){
        if(marcaOutroWrap) marcaOutroWrap.classList.remove('hidden');
        if(modeloOutroWrap) modeloOutroWrap.classList.remove('hidden');
        if(marcaOutroInp) marcaOutroInp.value = b.marca || '';
        if(modeloOutroInp) modeloOutroInp.value = b.modelo || '';
      } else if (tipoVal){
        // Marca
        let marcaOK = false;
        if(b.marca && marcaSel){
          const opt = Array.from(marcaSel.options).find(o => o.value === b.marca);
          if(opt){ marcaSel.value = b.marca; marcaSel.dispatchEvent(new Event('change')); marcaOK = true; }
        }
        if(!marcaOK && marcaSel){ marcaSel.value = 'Outro'; marcaSel.dispatchEvent(new Event('change')); if(marcaOutroWrap) marcaOutroWrap.classList.remove('hidden'); if(marcaOutroInp) marcaOutroInp.value = b.marca || ''; }
        // Modelos
        if(marcaSel && marcaSel.value && marcaSel.value!=='Outro' && modeloSel){
          let modeloOK = false;
          if(b.modelo){ const optM = Array.from(modeloSel.options).find(o => o.value === b.modelo); if(optM){ modeloSel.value = b.modelo; modeloSel.dispatchEvent(new Event('change')); modeloOK = true; } }
          if(!modeloOK){ modeloSel.value = 'Outro'; modeloSel.dispatchEvent(new Event('change')); if(modeloOutroWrap) modeloOutroWrap.classList.remove('hidden'); if(modeloOutroInp) modeloOutroInp.value = b.modelo || ''; }
        } else {
          if(modeloOutroWrap) modeloOutroWrap.classList.remove('hidden'); if(modeloOutroInp) modeloOutroInp.value = b.modelo || '';
        }
      }
      $('fichaBikeObs').value = b.observacoes_bike || b.observacoes || '';
      if(b.foto_bicicleta_url){ const img=$('previewFotoBicicleta'); img.src=b.foto_bicicleta_url; img.classList.remove('hidden'); }
    }
    // Paginação e seletor de bicicletas
    function popularSelectBikes(list, selecionadaId){
      if(!estado.pg) estado.pg = { page: 1, size: 10 };
      const total = list.length;
      const pageCount = Math.max(1, Math.ceil(total / estado.pg.size));
      if(estado.pg.page > pageCount) estado.pg.page = pageCount;
      const start = (estado.pg.page - 1) * estado.pg.size;
      const slice = list.slice(start, start + estado.pg.size);
      const sel = $('selectBicicleta');
      sel.innerHTML = '';
      slice.forEach(b => {
        const opt = document.createElement('option');
        const label = [b.numero_identificacao, b.marca, b.modelo].filter(Boolean).join(' · ');
        opt.value = b.id; opt.textContent = label || `Bicicleta ${b.id}`;
        sel.appendChild(opt);
      });
      // Selecionar a ativa quando estiver visível, senão selecionar a primeira da página
      let toSelect = slice.find(b => String(b.id)===String(selecionadaId)) || slice[0] || null;
      if(toSelect){ sel.value = String(toSelect.id); estado.bikeAtivaId = toSelect.id; preencherBike(toSelect); }
      const prev = $('bikePrev'), next = $('bikeNext'), lbl = $('bikePageLabel');
      if(prev && next && lbl){
        lbl.textContent = `${estado.pg.page}/${pageCount}`;
        prev.disabled = estado.pg.page<=1; next.disabled = estado.pg.page>=pageCount;
        prev.onclick = ()=>{ if(estado.pg.page>1){ estado.pg.page--; popularSelectBikes(estado.bicicletas, estado.bikeAtivaId); } };
        next.onclick = ()=>{ if(estado.pg.page<pageCount){ estado.pg.page++; popularSelectBikes(estado.bicicletas, estado.bikeAtivaId); } };
      }
      sel.onchange = ()=>{
        const idSel = sel.value;
        const b = estado.bicicletas.find(x => String(x.id)===String(idSel));
        if(b){ estado.bikeAtivaId = idSel; preencherBike(b); }
      };
    }

      const has = all.length > 0;
      if(btn){
        btn.disabled = has;
        btn.title = has ? `Exclua as ${all.length} bicicleta(s) antes de excluir o proprietário.` : '';
      }
      const btnAll = $('btnExcluirTodasBikes');
      if(btnAll){
        btnAll.disabled = !has;
        btnAll.title = has ? 'Exclui todas as bicicletas FORA deste proprietário' : 'Nenhuma bicicleta para excluir';
      }
    }

    // Carregar dados iniciais
    document.addEventListener('DOMContentLoaded', async () => {
      // Persistência de estado das seções (details/summary)
      (function initDetailsPersistence(){
        try {
          const dets = document.querySelectorAll('.container-ficha .modal-detail[data-key]');
          dets.forEach(d => {
            const key = d.getAttribute('data-key');
            const saved = localStorage.getItem('ficha_details_open_' + key);
            if(saved === '0') d.removeAttribute('open');
            else if(saved === '1') d.setAttribute('open','');
            d.addEventListener('toggle', ()=>{
              const isOpen = d.hasAttribute('open');
              localStorage.setItem('ficha_details_open_' + key, isOpen ? '1' : '0');
            });
          });
        } catch(_){}
      })();
      const propId = getParam('id');
      const bikeId = getParam('bike');
      if(!propId){ return; }

      // 1) Tentar cache salvo pela busca rápida
      let proprietario = null, bicicleta = null, bicicletas = [];
      try {
        const cacheRaw = sessionStorage.getItem('ficha_proprietario_cache');
        const cache = cacheRaw ? JSON.parse(cacheRaw) : {};
        const item = cache[String(propId)] || null;
        if(item){
          proprietario = item.proprietario || null;
          // Se houver bikeId, tentar achar no array que pode ter vindo, senão usar item.bicicleta
          if(Array.isArray(item.bicicletas)){
            bicicletas = item.bicicletas; 
            bicicleta = bicicletas.find(b => String(b.id) === String(bikeId)) || item.bicicleta || bicicletas[0] || null;
          } else {
            bicicleta = item.bicicleta || null;
          }
        }
      } catch(e){ console.warn('Cache inválido para ficha:', e); }

      // 2) Buscar dados atualizados do proprietário
      try { proprietario = await api.get(`/proprietarios/${encodeURIComponent(propId)}`); } catch(e){ console.warn('Falha ao buscar proprietário:', e); }
      // 3) Buscar bicicletas atuais
      try {
        const bikes = await api.get(`/proprietarios/${encodeURIComponent(propId)}/bicicletas`);
        if(Array.isArray(bikes)) bicicletas = bikes;
      } catch(e){ console.warn('Falha ao buscar bicicletas do proprietário:', e); }
      // Seleção da bike ativa
      if(!bicicleta){
        bicicleta = (bikeId && bicicletas.find(b => String(b.id)===String(bikeId))) || bicicletas[0] || null;
      }

      // 4) Preencher UI

      function gerarCodigoAlfa(){
        const prefixo = 'JPR-';
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

    // Máscaras e validações
    function maskCPF(v){
      v = (v||'').replace(/\D/g,'').slice(0,11);
      if(v.length>9) return v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
      if(v.length>6) return v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
      if(v.length>3) return v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
      return v;
    }
    function isCPFValid(cpf){
      const c = (cpf||'').replace(/\D/g,'');
      if(c.length!==11 || /^([0-9])\1+$/.test(c)) return false;
      let s=0; for(let i=0;i<9;i++) s+=parseInt(c.charAt(i))*(10-i); let d1=(s*10)%11; if(d1===10) d1=0; if(d1!==parseInt(c.charAt(9))) return false;
      s=0; for(let i=0;i<10;i++) s+=parseInt(c.charAt(i))*(11-i); let d2=(s*10)%11; if(d2===10) d2=0; return d2===parseInt(c.charAt(10));
    }
    function maskPhone(v){
      v = (v||'').replace(/\D/g,'').slice(0,11);
      if(v.length>10) return v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
      if(v.length>6) return v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
      if(v.length>2) return v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
      if(v.length>0) return '('+v;
      return v;
    }

    // Controles de arquivo customizados (file-control)
    function bindFileControl(inputId, buttonId, nameId){
      const input = document.getElementById(inputId);
      const btn = document.getElementById(buttonId);
      const nameEl = document.getElementById(nameId);
      const container = (btn && btn.closest('.file-control')) || (nameEl && nameEl.parentElement);
      if(!input || !btn) return;
      btn.onclick = ()=> input.click();
      input.addEventListener('change', ()=>{
        const file = input.files && input.files[0];
        if(nameEl){ nameEl.textContent = file ? file.name : 'Nenhum arquivo'; nameEl.title = file ? file.name : ''; }
        if(container){ container.classList.toggle('has-file', !!file); }
      });
    }

    // Confirm modal (acessibilidade: gerencia foco antes de alterar aria-hidden)
    function confirmDialog(title, body){
      return new Promise(resolve=>{
        const ov = document.getElementById('confirmOverlay');
        const t = document.getElementById('confirmTitle');
        const b = document.getElementById('confirmBody');
        const ok = document.getElementById('confirmOk');
        const cancel = document.getElementById('confirmCancel');
        const prevFocus = document.activeElement;
        t.textContent = title || 'Confirmar';
        b.textContent = body || '';
        const moveFocusOut = ()=>{
          try {
            // Se o foco estiver dentro do overlay, devolve para o elemento anterior
            if (ov.contains(document.activeElement)) {
              if (prevFocus && typeof prevFocus.focus === 'function') {
                prevFocus.focus();
              } else {
                // fallback: focar o body de forma segura
                const hadTabindex = document.body.hasAttribute('tabindex');
                if (!hadTabindex) document.body.setAttribute('tabindex','-1');
                document.body.focus();
                if (!hadTabindex) document.body.removeAttribute('tabindex');
              }
            }
          } catch(_){}
        };
        const off = ()=>{
          moveFocusOut();
          ov.classList.remove('open');
          ov.setAttribute('aria-hidden','true');
          ok.onclick=null; cancel.onclick=null;
        };
        ok.onclick = ()=>{ off(); resolve(true); };
        cancel.onclick = ()=>{ off(); resolve(false); };
        ov.classList.add('open');
        ov.setAttribute('aria-hidden','false');
        // Focar no botão OK após abrir
        setTimeout(()=>{ try{ ok.focus(); }catch(_){} }, 0);
      });
    }

    // Toast helper (com ícone e ação opcional)
    function toast(msg, variant='info', action){
      try {
        const area = document.getElementById('toastArea');
        const el = document.createElement('div');
        el.className = `toast ${variant}`; el.role='status';
        const icon = document.createElement('span'); icon.className='icon'; icon.textContent = variant==='ok'?'✓':(variant==='err'?'⚠':'ℹ');
        const text = document.createElement('span'); text.textContent = msg;
        el.appendChild(icon); el.appendChild(text);
        if(action && action.label && typeof action.onClick==='function'){
          const btn = document.createElement('button'); btn.className='action'; btn.textContent = action.label;
          btn.onclick = ()=>{ try{ action.onClick(); } finally { el.remove(); } };
          el.appendChild(btn);
        }
        area.appendChild(el);
        setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-6px)'; setTimeout(()=> el.remove(), 180); }, 4000);
      } catch(_) { alert(msg); }
    }
  </script>
</body>
